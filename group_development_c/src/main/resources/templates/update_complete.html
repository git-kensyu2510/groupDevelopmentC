<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>社員情報更新（完了）</title>
    <link rel="stylesheet" th:href="@{/employee.css}">
</head>
<body>
<div class="page">
    <div class="page-title">社員情報更新画面</div>

    <div class="content-box">
        <div class="form-frame">
            <div class="form-header">社員情報更新（完了）</div>

            <div class="message-area">
                <span th:text="${msg}">社員情報の更新が完了しました。</span>
            </div>

            <div class="button-area">
                <form th:action="@{/menu}" method="get" class="button-inline-form">
                    <button type="submit" class="btn btn-sub">メニュー</button>
                </form>

                <form th:action="@{/search}" method="get" class="button-inline-form">
                    <button type="submit" class="btn btn-sub">検索へ</button>
                </form>

                <form th:action="@{/insert}" method="get" class="button-inline-form">
                    <button type="submit" class="btn btn-accent">社員情報登録へ</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
